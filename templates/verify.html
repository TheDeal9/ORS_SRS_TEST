<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Confirm your email</title>
<script src="{{ url_for('static', filename='theme.js') }}"></script><link rel="icon" href="data:,"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="center"><button class="icon-btn theme-corner" type="button" data-theme-toggle aria-pressed="false">Dark mode</button>
<div class="card-page reveal"><h1>Confirm your email</h1><p>We sent a six-digit code to <strong>{{ email }}</strong>. It works once and expires in 10 minutes.</p>
{% with messages = get_flashed_messages() %}{% if messages %}<p class="warn-box">{{ messages[0] }}</p>{% endif %}{% endwith %}
<form method="post" action="{{ url_for('main.admin_verify') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="code">Code</label><input class="otp" type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required autofocus>
<button class="btn" type="submit">Confirm</button></form>
<form method="post" action="{{ url_for('main.admin_verify_resend') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn light" type="submit">Send a new code</button></form>
<p class="hint">{% if signed_in %}<a href="{{ url_for('main.account') }}">Back to Account</a>{% else %}<a href="{{ url_for('main.admin_login') }}">Back to sign in</a>{% endif %}</p></div>
<script src="{{ url_for('static', filename='vendor/motion.js') }}" defer></script><script src="{{ url_for('static', filename='admin.js') }}" defer></script></body></html>
